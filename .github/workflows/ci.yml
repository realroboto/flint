name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # `shell: bash` = Git Bash on the Windows runner — the exact path
      # shell-form hooks take on real Windows machines (ADR 0002).
      - name: test matrix
        shell: bash
        run: sh test/test.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck hooks/flint-style.sh install.sh test/test.sh
